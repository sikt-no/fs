<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
__STIL__
</style>

<header class="top">
  <div class="wrap">
    <div class="eyebrow" id="eyebrow">Intern akseptansetest · fase 3</div>
    <h1 id="title"></h1>
    <div class="metaline" id="metaline"></div>
    <div class="verdict" id="verdict"></div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<nav class="bar" aria-label="Seksjoner og filter">
  <div class="wrap">
    <div class="links" id="links"></div>
    <div class="filters">
      <div class="seg" role="group" aria-label="Vis" id="f-vis" hidden>
        <button id="vis-alt" data-v="alt" aria-pressed="true">Alle</button>
        <button id="vis-ikke" data-v="ikke" aria-pressed="false">Ikke bestått</button>
        <button id="vis-tom" data-v="tom" aria-pressed="false">Ikke fylt ut</button>
      </div>
    </div>
  </div>
</nav>

<main>
  <div class="wrap" id="content"></div>
</main>

<footer>
  <div class="wrap">
    <dl id="meta"></dl>
  </div>
</footer>

<script>
__FELLES__
</script>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var T = TV, esc = T.esc, inl = T.inl;
  var title = D.h1.replace(/^Intern akseptansetest\s*[–-]\s*/i, '') || D.h1;
  document.getElementById('title').textContent = title;
  var state = T.store('tc-view'); if (!state.vis) state.vis = 'alt';

  // —— Testcasene: tabellene med «Steg» og «Forventet resultat» ——
  var TEST_SEC = /^(Testcaser|Testgjennomføring)$/i;
  var cards = [], other = [], lvl2 = null, lvl3 = null, lvl4 = null;
  var cardFor = {};
  function getCard(key, title, kind, intro) {
    if (!cardFor[key]) { cardFor[key] = { title: title, kind: kind, intro: intro || [], rules: [], rows: [] }; (kind === 'main' ? cards : other).push(cardFor[key]); }
    return cardFor[key];
  }
  var nonTest = []; // ## seksjoner uten testcaser
  D.sections.forEach(function (s, idx) {
    if (s.level === 2) { lvl2 = s; lvl3 = null; lvl4 = null; }
    else if (s.level === 3) { lvl3 = s; lvl4 = null; }
    else if (s.level === 4) { lvl4 = s; }
    var tts = s.blocks.filter(function (b) { return b.t === 'table' && T.col(b.head, /^steg$/i) >= 0 && T.col(b.head, /^forventet/i) >= 0; });
    if (!tts.length) return;
    var inTest = lvl2 && TEST_SEC.test(lvl2.title);
    var cardSec = inTest ? (lvl3 || lvl2) : lvl2;
    var ruleSec = inTest ? (lvl3 ? lvl4 : lvl3) : (lvl3 || null);
    var c = getCard((cardSec ? cardSec.title : '') + '#' + D.sections.indexOf(cardSec), cardSec ? cardSec.title : '', inTest ? 'main' : 'other', cardSec ? cardSec.blocks.filter(function (b) { return b.t !== 'table'; }) : []);
    if (lvl2) lvl2.hasTests = true;
    tts.forEach(function (tb) {
      var h = tb.head;
      var ix = {
        nr: T.col(h, /^(nr|del)$/i), sc: T.col(h, /^(scenario|hva som prøves|hva testeren vurderer|test i fase 2|avhengighet)$/i),
        steg: T.col(h, /^steg$/i), fv: T.col(h, /^forventet/i), fa: T.col(h, /^faktisk/i), st: T.col(h, /^status$/i), hv: T.col(h, /^hvorfor/i)
      };
      var rule = ruleSec && ruleSec !== cardSec ? ruleSec.title.replace(/^Regel:\s*/i, '') : null;
      var ruleIntro = ruleSec && ruleSec !== cardSec ? ruleSec.blocks.filter(function (b) { return b.t !== 'table'; }) : [];
      tb.rows.forEach(function (r) {
        if (T.emptyRow(r)) return;
        var nr = T.cell(r, ix.nr), sc = T.cell(r, ix.sc);
        if (!nr && !sc) { c.rows.push({ note: r.filter(Boolean).join(' '), rule: rule, ruleIntro: ruleIntro }); return; }
        c.rows.push({ nr: nr, sc: sc, steg: T.cell(r, ix.steg), fv: T.cell(r, ix.fv), fa: T.cell(r, ix.fa), st: T.status(T.cell(r, ix.st)), hv: T.cell(r, ix.hv), rule: rule, ruleIntro: ruleIntro });
      });
    });
  });
  var rows = cards.concat(other).reduce(function (a, c) { return a.concat(c.rows.filter(function (r) { return !r.note; })); }, []);
  var cnt = { ok: 0, ikke: 0, ikketestet: 0, tom: 0, uklar: 0 };
  rows.forEach(function (r) { cnt[r.st.k]++; });
  var filled = rows.length - cnt.tom;
  function minutes(t) { var m = String(t).match(/ca\.\s*(\d+)\s*min/i); return m ? +m[1] : 0; }
  var mins = cards.concat(other).reduce(function (a, c) { return a + minutes(c.title); }, 0);
  function cleanTitle(t) { return String(t).replace(/\s*\(ca\.\s*\d+\s*minutter\)\s*$/i, ''); }

  // —— Header ——
  document.getElementById('metaline').innerHTML = [['Testplan', 'Testplan'], ['Verifisering', 'Verifisering'], ['Agentisk funksjonstest', 'Agentisk test']]
    .filter(function (x) { return D.meta[x[0]]; }).map(function (x) { return '<span><b>' + x[1] + '</b> ' + inl(D.meta[x[0]]) + '</span>'; }).join('');
  var v = document.getElementById('verdict');
  var nCards = cards.length + other.length;
  if (!filled) {
    v.className = 'verdict info';
    v.innerHTML = '<span class="dot"></span><div><h2>Klar til testing</h2><p>' + rows.length + ' testcaser i ' + nCards + ' deler' + (mins ? ', ca. ' + mins + ' minutter' : '') + '. Ta dem i rekkefølgen de står, og fyll ut «Faktisk resultat» og «Status» på testsiden.</p></div>';
  } else if (cnt.ikke) {
    v.className = 'verdict';
    v.innerHTML = '<span class="dot"></span><div><h2>' + cnt.ikke + ' testcaser er ikke bestått</h2><p>' + cnt.ok + ' bestått, ' + cnt.ikketestet + ' ikke testet og ' + cnt.tom + ' ikke fylt ut, av ' + rows.length + '. Resultatet og beslutningen står i testrapporten.</p></div>';
  } else {
    v.className = cnt.tom ? 'verdict warn' : 'verdict good';
    v.innerHTML = '<span class="dot"></span><div><h2>' + (cnt.tom ? 'Testingen pågår' : 'Alle testcasene er bestått eller begrunnet') + '</h2><p>' + cnt.ok + ' bestått, ' + cnt.ikketestet + ' ikke testet og ' + cnt.tom + ' ikke fylt ut, av ' + rows.length + '.</p></div>';
  }
  var st = [['Testcaser', rows.length], ['Deler', nCards]];
  if (mins) st.push(['Minutter, ca.', mins]);
  if (filled) st.push(['Bestått', cnt.ok, ''], ['Ikke bestått', cnt.ikke, cnt.ikke ? 'bad' : ''], ['Ikke fylt ut', cnt.tom, cnt.tom ? 'warn' : '']);
  document.getElementById('stats').innerHTML = T.stats(st);

  // —— Seksjonene ——
  var html = '', links = [];
  function sec(id, title, lede, body, count) {
    links.push([id, title]);
    html += '<section id="' + id + '"><div class="sechead"><h2>' + esc(title) + '</h2>' + (count != null ? '<span class="count">' + count + '</span>' : '') + '</div>' + (lede ? '<p class="lede">' + lede + '</p>' : '') + body + '</section>';
  }
  // Før du starter: teksten før den første ##, «Slik …», «Avhengigheter» og andre seksjoner med bare tekst
  var KNOWN = /^(Testcaser|Testgjennomføring|Ikke testbart nå|Ikke med i denne testen|Funn|Andre funn)$/i;
  var before = [];
  D.sections.forEach(function (s, i) {
    if (s.level === 0 && s.blocks.length) before.push({ title: 'Om testen', blocks: s.blocks });
    if (s.level === 2 && !KNOWN.test(s.title) && !s.hasTests) {
      var kids = [];
      for (var j = i + 1; j < D.sections.length && D.sections[j].level > 2; j++) kids = kids.concat([{ t: 'p', text: '**' + D.sections[j].title + '**' }], D.sections[j].blocks);
      before.push({ title: s.title, blocks: s.blocks.concat(kids) });
    }
  });
  if (before.length) sec('start', 'Før du starter', 'Testdataene, hvordan du tester, og det testen er avhengig av.', '<div class="cards">' + before.map(function (b) { return '<div class="prosecard"><h3>' + esc(b.title) + '</h3><div class="prose">' + T.blocks(b.blocks) + '</div></div>'; }).join('') + '</div>');

  var open = {};
  function visible(r) {
    if (state.vis === 'alt') return true;
    if (r.note) return false;
    if (state.vis === 'ikke') return r.st.k === 'ikke' || r.st.k === 'uklar';
    return r.st.k === state.vis;
  }
  function cardHtml(c, ci) {
    var list = c.rows.filter(function (r) { return !r.note; });
    var cc = { ok: 0, ikke: 0, tom: 0 }; list.forEach(function (r) { if (cc[r.st.k] != null) cc[r.st.k]++; });
    var m = minutes(c.title);
    var head = '<div class="kravhead"><div class="row1"><h3>' + inl(cleanTitle(c.title)) + '</h3><span class="kid">' + list.length + ' testcaser' + (m ? ' · ca. ' + m + ' min' : '') + '</span></div>' +
      (filled ? '<div class="progress">' + T.chip('ok', cc.ok + ' bestått') + (cc.ikke ? T.chip('miss', cc.ikke + ' ikke bestått') : '') + (cc.tom ? T.chip('na', cc.tom + ' ikke fylt ut') : '') + '</div>' : '') +
      (c.intro.length ? '<div class="prose gjen">' + T.blocks(c.intro) + '</div>' : '') + '</div>';
    var body = '', lastRule = null, shown = 0;
    c.rows.forEach(function (r, ri) {
      if (!visible(r)) return;
      if (r.rule && r.rule !== lastRule) {
        body += '<tr class="rule"><td colspan="3">Regel: ' + inl(r.rule) + (r.ruleIntro.length ? '<div class="prose" style="font-weight:400;margin-top:4px">' + T.blocks(r.ruleIntro) + '</div>' : '') + '</td></tr>';
        lastRule = r.rule;
      }
      if (r.note) { body += '<tr class="note"><td colspan="3">' + inl(r.note) + '</td></tr>'; return; }
      shown++;
      var key = ci + ':' + ri, isOpen = !!open[key];
      body += '<tr class="sc" tabindex="0" data-key="' + key + '" aria-expanded="' + isOpen + '"><td><span class="caret">▸</span><span class="scline" style="margin:0 8px 0 0">' + esc(r.nr) + '</span><span class="sctitle">' + inl(r.sc) + '</span></td>' +
        '<td class="c" colspan="2"><span class="chip ' + r.st.cls + '">' + esc(r.st.label) + '</span></td></tr>';
      if (isOpen) body += '<tr class="detail"><td colspan="3"><div class="tcdetail"><div><h4>Steg</h4>' + T.steps(r.steg) + '</div><div><h4>Forventet resultat</h4><div class="prose">' + inl(r.fv) + '</div>' +
        (r.hv ? '<h4 style="margin-top:10px">Hvorfor</h4><div class="prose">' + inl(r.hv) + '</div>' : '') + '</div>' +
        (r.fa ? '<div class="actual"><h4>Faktisk resultat</h4><div class="prose">' + inl(r.fa) + '</div></div>' : '') + '</div></td></tr>';
    });
    var table = shown ? '<div class="scroll"><table class="matrix"><thead><tr><th>Testcase</th><th class="c" colspan="2" style="width:150px">Status</th></tr></thead><tbody>' + body + '</tbody></table></div>'
      : '<p class="empty" style="padding:14px 18px;margin:0">Ingen testcaser med valgt status.</p>';
    return '<article class="krav" data-card="' + ci + '">' + head + table + '</article>';
  }
  function renderCards(list, offset) { return '<div class="cards">' + list.map(function (c, i) { return cardHtml(c, offset + i); }).join('') + '</div>'; }
  if (cards.length) sec('testcaser', 'Testcasene', 'Én testcase per flyt eller oppgave, i rekkefølgen arbeidsprosessen går. Klikk på en testcase for å se stegene og forventet resultat.', '<div id="cards-main"></div>', cards.length + ' deler');
  if (other.length) sec('andre-testcaser', 'Andre testcaser', 'Det den agentiske testen ikke klarte, det med høyest risiko, opplevelse og helhet, og avhengigheter som testes for seg.', '<div id="cards-other"></div>', other.length + ' deler');

  function listSection(id, re, cls, lede) {
    var s = T.section(D, re); if (!s) return;
    var tb = T.tables(s)[0];
    var items = tb ? tb.rows.filter(function (r) { return !T.emptyRow(r); }) : [];
    var body = items.length ? T.group(cls, s.title, '', items, function (r) {
      return '<li><div class="rmain">' + inl(r[0]) + '</div>' + tb.head.slice(1).map(function (h, i) { return r[i + 1] ? '<div class="rtext"><span class="kid">' + esc(h) + ':</span> ' + inl(r[i + 1]) + '</div>' : ''; }).join('') + '</li>';
    }) : '<p class="empty">Ingen.</p>';
    sec(id, s.title, lede || (T.texts(s).length ? T.blocks(T.texts(s)).replace(/<\/?p>/g, '') : ''), body, items.length || null);
  }
  listSection('ikke-testbart', /^Ikke testbart nå$/i, 'decide');
  listSection('ikke-med', /^Ikke med i denne testen$/i, 'info');
  function funnSection(id, re, lede) {
    var s = T.section(D, re); if (!s) return;
    var tbs = T.tables(s);
    var legend = tbs.filter(function (t) { return /^alvorlighetsgrad$/i.test(t.head[0]); })[0];
    var tb = tbs.filter(function (t) { return t !== legend; })[0];
    var items = tb ? tb.rows.filter(function (r) { return !T.emptyRow(r); }) : [];
    var body = items.length ? T.table({ head: tb.head, rows: items }) : '<p class="empty">Ingen ført ennå.</p>';
    if (legend) body += '<details class="more"><summary>Alvorlighetsgradene</summary><div class="in">' + T.table(legend) + '</div></details>';
    sec(id, s.title, lede, body, items.length || null);
  }
  funnSection('funn', /^Funn$/i, 'Feil testerne fant, med alvorlighetsgrad. Fylles ut på testsiden under testingen.');
  funnSection('andre-funn', /^Andre funn$/i, 'Det testerne oppdaget som ikke gjelder testcasene, for eksempel brukervennlighet, eller et tilfelle kravet ikke dekker.');

  document.getElementById('content').innerHTML = html;
  document.getElementById('links').innerHTML = T.nav(links);
  function renderCardsAll() {
    var a = document.getElementById('cards-main'); if (a) a.innerHTML = renderCards(cards, 0);
    var b = document.getElementById('cards-other'); if (b) b.innerHTML = renderCards(other, cards.length);
  }
  function cardByIndex(i) { return i < cards.length ? cards[i] : other[i - cards.length]; }
  document.getElementById('content').addEventListener('click', function (e) {
    var tr = e.target.closest('tr.sc'); if (!tr) return;
    open[tr.dataset.key] = !open[tr.dataset.key]; renderCardsAll();
  });
  document.getElementById('content').addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.sc')) {
      e.preventDefault(); var key = e.target.dataset.key; open[key] = !open[key]; renderCardsAll();
      var el = document.querySelector('tr.sc[data-key="' + key + '"]'); if (el) el.focus();
    }
  });
  var fv = document.getElementById('f-vis');
  if (filled) {
    fv.hidden = false;
    fv.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; state.vis = b.dataset.v; T.store('tc-view', state); paintFilter(); renderCardsAll(); });
  } else state.vis = 'alt';
  function paintFilter() { fv.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === state.vis)); }); }
  paintFilter(); renderCardsAll();

  document.getElementById('meta').innerHTML = T.meta(['Nivå', 'Testplan', 'Scope', 'Krav', 'Verifisering', 'Agentisk funksjonstest', 'Skjermens ord', 'Confluence', 'Laget'], D.meta,
    [['Fil', '<code>' + esc(D.kilde) + '</code>'], ['Visningen laget', esc(D.laget)]]);
})();
</script>
