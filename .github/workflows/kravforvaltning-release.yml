name: Release FS Kravforvaltning

# Changesets holder en «Version Packages»-PR oppdatert mens det finnes changesets i fs-kravforvaltning/.changeset/.
# Når PR-en er merget (ingen changesets igjen, og versjonen i package.json har ingen release), bygges desktop-appen
# for macOS, Windows og Linux og legges ved en GitHub-release med tag `fs-kravforvaltning-v<versjon>`.
# Se fs-kravforvaltning/docs/release.md.

on:
  push:
    branches: [main]
    paths:
      - 'fs-kravforvaltning/**'
      - '.github/workflows/kravforvaltning-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kravforvaltning-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: fs-kravforvaltning

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: fs-kravforvaltning/package-lock.json
      - run: npm ci

      - name: Oppdater Version Packages-PR
        id: changesets
        uses: changesets/action@v2
        with:
          cwd: fs-kravforvaltning
          version-script: npm run changeset:version
          commit-message: 'fs-kravforvaltning: ny versjon'
          pr-title: 'fs-kravforvaltning: ny versjon'

      - name: Finnes releasen for denne versjonen?
        id: check
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="fs-kravforvaltning-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # En draft fra en kjøring som feilet, bygges på nytt. En publisert release røres ikke.
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "$tag er allerede publisert"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk at Client ID er satt
        working-directory: .
        env:
          CLIENT_ID: ${{ vars.KRAV_GITHUB_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Repo-variabelen KRAV_GITHUB_CLIENT_ID mangler. Uten den kan ikke brukerne logge inn på GitHub i appen (se fs-kravforvaltning/docs/github-oauth.md)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Lag draft-release med endringene fra CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Draft for $TAG finnes fra før"
            exit 0
          fi
          [ -f CHANGELOG.md ] && awk -v v="$VERSION" '/^## /{ if (p) exit; if ($2 == v) p = 1; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "FS Kravforvaltning $VERSION" > notes.md
          cat >> notes.md <<'EOF'

          ### Installasjon

          EOF
          if [ "$MAC_SIGNED" = "true" ]; then
            echo '- **macOS**: `.dmg` (`arm64` for Apple Silicon, `x64` for Intel). Åpne fila og dra appen til Programmer.' >> notes.md
          else
            echo '- **macOS**: `.dmg` (`arm64` for Apple Silicon, `x64` for Intel). Appen er ikke signert, så macOS stopper den. Dra appen til Programmer, og kjør én gang i Terminal: `xattr -dr com.apple.quarantine "/Applications/FS Kravforvaltning.app"`' >> notes.md
          fi
          cat >> notes.md <<'EOF'
          - **Windows**: `.exe`. Appen er ikke signert: velg **Mer informasjon → Kjør likevel** hvis SmartScreen stopper den.
          - **Linux**: `.AppImage`. Gjør fila kjørbar med `chmod +x`.
          EOF
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "FS Kravforvaltning $VERSION" --notes-file notes.md

  build:
    needs: [version, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
            files: release/*.dmg
          - os: windows-latest
            args: --win --x64
            files: release/*.exe
          - os: ubuntu-latest
            args: --linux --x64
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      MAIN_VITE_KRAV_GITHUB_CLIENT_ID: ${{ vars.KRAV_GITHUB_CLIENT_ID }}
    steps:
      # Bare appen: stiene i tasks/ og krav/ er for lange for Windows (MAX_PATH), og bygget bruker dem ikke
      - uses: actions/checkout@v7
        with:
          sparse-checkout: fs-kravforvaltning
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: fs-kravforvaltning/package-lock.json
      - name: Sjekk at Client ID er satt
        run: |
          if [ -z "$MAIN_VITE_KRAV_GITHUB_CLIENT_ID" ]; then
            echo "::error::Repo-variabelen KRAV_GITHUB_CLIENT_ID mangler. Uten den kan ikke brukerne logge inn på GitHub i appen (se docs/github-oauth.md)."
            exit 1
          fi
      # Signering og notarisering på macOS (docs/release.md). Secrets-ene settes bare i dette steget, så
      # Windows-bygget ikke prøver å signere med Apple-sertifikatet (electron-builder leser CSC_LINK der også).
      # Uten MAC_CSC_LINK bygges appen usignert, som før.
      - name: Klargjør signering (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_CSC_LINK" ]; then
            echo "::warning::MAC_CSC_LINK mangler, så macOS-appen bygges usignert."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$MAC_CSC_KEY_PASSWORD" ] || [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::MAC_CSC_LINK er satt, men MAC_CSC_KEY_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID eller APPLE_API_ISSUER mangler (se docs/release.md)."
            exit 1
          fi
          # electron-builder (@electron/notarize) vil ha en sti til .p8-fila, ikke innholdet
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          {
            echo "CSC_LINK=$MAC_CSC_LINK"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
            echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --publish never ${{ matrix.args }}
      - name: Sjekk signatur og notarisering (macOS)
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        run: |
          for app in release/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
            xcrun stapler validate "$app"
          done
      - name: Last opp til releasen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.version.outputs.tag }}" ${{ matrix.files }} --clobber

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publiser releasen
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
