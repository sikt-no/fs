# Pakking av desktop-appen: `npm run app:dist` → release/
appId: no.sikt.krav-viewer
productName: FS Kravforvaltning
directories:
  output: release
  buildResources: build
# Alt appen trenger er bundlet inn i out/ av electron-vite; node_modules skal ikke med, bortsett fra node-pty
# (terminalen), som har en binærfil og `spawn-helper`. De må ligge utenfor asar-arkivet for å kunne kjøres.
files:
  - out/**
  - package.json
  - "!node_modules/**"
  - node_modules/node-pty/package.json
  - node_modules/node-pty/lib/**
  - node_modules/node-pty/prebuilds/${platform}-${arch}/**
  - node_modules/node-pty/build/Release/**
asar: true
asarUnpack:
  - node_modules/node-pty/**
# node-pty har ferdigbygde N-API-binærfiler for macOS og Windows, som virker i Electron uten å bygges på nytt.
# Linux har ingen; der bygges den med node-gyp i release-workflowen før pakkingen (N-API, så den virker også i Electron)
npmRebuild: false
# Uten mellomrom, så filene kan lastes opp til GitHub-releasen med glob (.github/workflows/kravforvaltning-release.yml)
artifactName: fs-kravforvaltning-${version}-${os}-${arch}.${ext}
# Signeres med Developer ID-sertifikatet i CSC_LINK (eller i nøkkelringen lokalt), med hardened runtime og
# standard-entitlements fra electron-builder. Notariseres når APPLE_API_KEY, APPLE_API_KEY_ID og APPLE_API_ISSUER
# er satt (release-workflowen). Se docs/release.md
# zip er det electron-updater laster ned ved oppdatering; dmg er for første installasjon
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
# Windows og Linux er tatt ut av bygget foreløpig (se docs/release.md). Ta dem inn igjen her og i release-workflowen
# win:
#   target: nsis
# linux:
#   target: AppImage
# Appen oppdaterer seg selv fra GitHub-releasene (electron/updater.ts). Med denne blokken skriver electron-builder
# latest-mac.yml og *.blockmap til release/, også med `--publish never`. Workflowen laster dem opp selv med gh.
# updater.ts setter feeden ved kjøring, fordi tagg-prefikset gjør at «Latest» i repoet ikke kan brukes
publish:
  provider: github
  owner: sikt-no
  repo: fs
  releaseType: release
